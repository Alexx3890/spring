# ===================================================================
# Database Connection Configuration for PostgreSQL
# ===================================================================
db.driver=org.postgresql.Driver
db.url=jdbc:postgresql://localhost:5432/retail_db
db.user=postgres
db.password=0001

# Fallback in-memory/embedded H2 configuration
# (activated automatically if local PostgreSQL server is unavailable)
db.fallback.driver=org.h2.Driver
db.fallback.url=jdbc:h2:mem:retail_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
db.fallback.user=sa
db.fallback.password=
